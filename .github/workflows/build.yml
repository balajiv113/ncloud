name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_ios:
        description: Also build the optional unsigned iOS device release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - run: flutter test test/ui_capture_test.dart --dart-define=CAPTURE_UI=true
        if: success() || failure()
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-previews
          path: build/ui/
      - name: Start isolated Nextcloud integration fixture
        if: success() || failure()
        run: |
          docker info >/dev/null
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "NEXTCLOUD_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --detach --name ncloud-nextcloud \
            --publish 127.0.0.1:8080:80 \
            --env NEXTCLOUD_ADMIN_USER=ncloud-ci \
            --env NEXTCLOUD_ADMIN_PASSWORD="$password" \
            --env SQLITE_DATABASE=ncloud \
            --env 'NEXTCLOUD_TRUSTED_DOMAINS=127.0.0.1 localhost' \
            nextcloud:32-apache
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/status.php | grep -q '"installed":true'; then
              docker exec --user www-data ncloud-nextcloud php occ app:enable photos
              docker exec --user www-data ncloud-nextcloud php occ app:install memories
              docker exec ncloud-nextcloud sh -c 'apt-get update -qq && apt-get install -y -qq libimage-exiftool-perl'
              docker exec --user www-data ncloud-nextcloud php occ config:app:set memories exiftool --value=/usr/bin/exiftool
              curl --fail-with-body --silent --show-error --user "ncloud-ci:$password" \
                -X MKCOL http://127.0.0.1:8080/remote.php/dav/files/ncloud-ci/ncloud-index
              printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGOQqMgGAAGnAPzLMdOkAAAAAElFTkSuQmCC' \
                | base64 --decode > "$RUNNER_TEMP/ncloud-seed.png"
              curl --fail-with-body --silent --show-error --user "ncloud-ci:$password" \
                -T "$RUNNER_TEMP/ncloud-seed.png" \
                http://127.0.0.1:8080/remote.php/dav/files/ncloud-ci/ncloud-index/seed.png
              docker exec --user www-data ncloud-nextcloud bash -c \
                'for i in $(seq 1 200); do cp data/ncloud-ci/files/ncloud-index/seed.png "data/ncloud-ci/files/ncloud-index/seed-$i.png"; done'
              docker exec --user www-data ncloud-nextcloud bash -c \
                'mkdir -p data/ncloud-ci/files/ncloud-index/Travel/Japan; cp data/ncloud-ci/files/ncloud-index/seed.png data/ncloud-ci/files/ncloud-index/Travel/Japan/nested.png'
              docker exec --user www-data ncloud-nextcloud php occ files:scan --path=/ncloud-ci/files/ncloud-index --no-interaction
              docker exec --user www-data ncloud-nextcloud php occ memories:index --user=ncloud-ci --no-interaction
              exit 0
            fi
            sleep 2
          done
          echo "Nextcloud did not become ready"
          exit 1
      - name: Verify real Nextcloud APIs
        if: success() || failure()
        run: |
          flutter test test/live_nextcloud_test.dart \
            --dart-define=LIVE_NEXTCLOUD=true \
            --dart-define=NEXTCLOUD_TEST_PASSWORD="$NEXTCLOUD_TEST_PASSWORD"

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-overwrite-existing: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ./.github/actions/android-toolchain
      - run: flutter pub get
      - name: Set Android preview signing location
        run: echo "NCLOUD_PREVIEW_KEYSTORE=$RUNNER_TEMP/ncloud-android/debug.keystore" >> "$GITHUB_ENV"
      - name: Reuse development preview signer when available
        uses: actions/cache@v4
        with:
          path: ${{ env.NCLOUD_PREVIEW_KEYSTORE }}
          key: ncloud-android-preview-signer-v1
      - name: Initialize development preview signer
        run: |
          mkdir -p "$(dirname "$NCLOUD_PREVIEW_KEYSTORE")"
          if [ ! -f "$NCLOUD_PREVIEW_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$NCLOUD_PREVIEW_KEYSTORE" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build installable preview
        run: |
          start=$SECONDS
          flutter build apk --release --no-pub --build-number=${{ github.run_number }}
          elapsed=$((SECONDS - start))
          echo "Release APK build: ${elapsed}s"
          echo "### Android release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Build time: **${elapsed} seconds** (excluding tests and cache restore/save)." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify APK uses the cached preview signer
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          expected=$(keytool -list -v -keystore "$NCLOUD_PREVIEW_KEYSTORE" \
            -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          "$apksigner" verify --verbose --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | tee "$RUNNER_TEMP/ncloud-apk-signature.txt"
          actual=$(sed -n 's/^.*certificate SHA-256 digest: //p' \
            "$RUNNER_TEMP/ncloud-apk-signature.txt" | tr -d '[:space:]' | tr 'A-F' 'a-f')
          echo "Expected signer: $expected"
          echo "APK signer:      $actual"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "APK signing certificate does not match the cached preview key"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ncloud-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: pubspec.lock

  android-device-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse existing Android Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-overwrite-existing: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore Android SDK and NDK
        uses: ./.github/actions/android-toolchain
      - run: flutter pub get
      - name: Build shared mobile fixture and native Android checks once
        run: |
          flutter build apk --debug --no-pub --target-platform android-x64 \
            --target integration_test/mobile_test.dart
          cd android
          ./gradlew :app:assembleDebugAndroidTest :app:testDebugUnitTest \
            :ncloud_folder_access:testDebugUnitTest \
            -Ptarget-platform=android-x64 -Ptarget=integration_test/mobile_test.dart \
            --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-device-checks
          path: |
            build/app/outputs/apk/debug/app-debug.apk
            build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  android-device:
    needs: android-device-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Locate Android SDK
        id: sdk
        run: echo "root=${ANDROID_HOME:?ANDROID_HOME is required}" >> "$GITHUB_OUTPUT"
      - name: Restore Android emulator system image
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.root }}/system-images/android-35/google_apis/x86_64
          key: android-system-image-v1-${{ runner.os }}-${{ runner.arch }}-35-google-apis-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: android-device-checks
      - name: Allow Android emulator acceleration
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash .github/scripts/android-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-results
          path: |
            *-device-*.log
            native-android-result.txt

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, android, android-device, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ncloud-android
      - name: Publish private Android preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-release.apk ncloud-android.apk
          gh release create "v0.5.5-preview.${{ github.run_number }}" ncloud-android.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "ncloud Android preview #${{ github.run_number }}" \
            --notes "ncloud 0.5.5 preview: Drive lists unique direct children of the selected folder. Android selected-folder backup supports opt-in best-effort interval/daily/weekly schedules, notification controls, retryable settings loading, subfolder/type filters and up to three create-only upload lanes. No device or cloud originals are deleted or overwritten. Per-file receipts preserve confirmed progress; interrupted originals restart in full. Source folders and subfolders are preserved. Updates reuse the cached development signer. The accompanying iOS source includes scene lifecycle support and explicitly selected whole-Photos-album backup with best-effort background processing; this Android APK is not an iOS installer."

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Start simulator while dependencies and app compile
        run: |
          bash .github/scripts/boot-ios-simulator.sh \
            > "$RUNNER_TEMP/ncloud-simulator-boot.log" 2>&1 &
          echo "Simulator launch running as process $!"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore CocoaPods dependencies
        id: pods
        uses: actions/cache/restore@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ runner.arch }}-xcode-26.2-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'pubspec.lock') }}
      - name: Configure simulator fixture and install pods
        run: |
          flutter build ios --simulator --debug --config-only --no-pub \
            --target integration_test/mobile_test.dart
          cd ios
          pod install --deployment
      - name: Save CocoaPods dependencies before testing
        if: steps.pods.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ steps.pods.outputs.cache-primary-key }}
      - name: Build iOS simulator checks once
        timeout-minutes: 15
        run: |
          start=$SECONDS
          test -s "$RUNNER_TEMP/ncloud-simulator-device"
          device=$(cat "$RUNNER_TEMP/ncloud-simulator-device")
          xcodebuild build-for-testing \
            -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination "platform=iOS Simulator,id=$device,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/ncloud-ios-simulator" \
            FLUTTER_TARGET="$GITHUB_WORKSPACE/integration_test/mobile_test.dart" \
            CODE_SIGNING_ALLOWED=NO -quiet
          echo "Simulator build: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for early simulator boot and seed Photos
        timeout-minutes: 6
        run: |
          start=$SECONDS
          for attempt in $(seq 1 300); do
            if [ -f "$RUNNER_TEMP/ncloud-simulator-failed" ]; then
              cat "$RUNNER_TEMP/ncloud-simulator-boot.log"
              exit 1
            fi
            if [ -f "$RUNNER_TEMP/ncloud-simulator-ready" ]; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ncloud-simulator-boot.log"
          test -f "$RUNNER_TEMP/ncloud-simulator-ready"
          device=$(cat "$RUNNER_TEMP/ncloud-simulator-device")
          echo "Remaining simulator boot wait: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGOQqMgGAAGnAPzLMdOkAAAAAElFTkSuQmCC' \
            | base64 --decode > "$RUNNER_TEMP/ncloud-probe.png"
          xcrun simctl addmedia "$device" "$RUNNER_TEMP/ncloud-probe.png"
      - name: Run native and Photos UI tests in one XCTest session
        timeout-minutes: 10
        run: |
          start=$SECONDS
          device=$(cat "$RUNNER_TEMP/ncloud-simulator-device")
          xcodebuild test-without-building \
            -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/ncloud-ios-simulator" \
            -destination "platform=iOS Simulator,id=$device,arch=arm64" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/ncloud-ios-tests.xcresult" \
            -quiet
          echo "XCTest session (including launch/teardown): $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/ncloud-ios-tests.xcresult" \
            | tee "$RUNNER_TEMP/ncloud-ios-summary.json"
          jq -e '.passedTests >= 24 and .failedTests == 0 and .skippedTests == 0' \
            "$RUNNER_TEMP/ncloud-ios-summary.json"
          xcrun xcresulttool get test-results tests \
            --path "$RUNNER_TEMP/ncloud-ios-tests.xcresult" \
            > "$RUNNER_TEMP/ncloud-ios-test-durations.json"
      - name: Run shared mobile contract and PhotoKit checks without rebuilding
        timeout-minutes: 5
        run: |
          start=$SECONDS
          device=$(cat "$RUNNER_TEMP/ncloud-simulator-device")
          xcrun simctl launch "$device" app.ncloud.ncloud \
            --enable-checked-mode --verify-entry-points \
            --vm-service-port=8585 --disable-service-auth-codes
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8585/getVM > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8585/getVM > /dev/null
          VM_SERVICE_URL=http://127.0.0.1:8585 \
            dart run test_driver/mobile_test.dart
          echo "Shared mobile + PhotoKit checks: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-device-results
          path: |
            ${{ runner.temp }}/ncloud-ios-tests.xcresult
            ${{ runner.temp }}/ncloud-ios-summary.json
            ${{ runner.temp }}/ncloud-ios-test-durations.json
            ${{ runner.temp }}/ncloud-simulator-boot.log

  ios-release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/cache/restore@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ runner.arch }}-xcode-26.2-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'pubspec.lock') }}
      - run: flutter build ios --release --no-codesign --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: ncloud-ios-unsigned-not-installable
          path: build/ios/iphoneos/Runner.app
