name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_ios:
        description: Also build an unsigned iOS app (requires macOS runner)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Gradle dependencies and task outputs
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-overwrite-existing: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore Android SDK and NDK
        uses: ./.github/actions/android-toolchain
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - run: flutter test test/ui_capture_test.dart --dart-define=CAPTURE_UI=true
        if: success() || failure()
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-previews
          path: build/ui/
      - name: Start isolated Nextcloud integration fixture
        if: success() || failure()
        run: |
          docker info >/dev/null
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "NEXTCLOUD_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --detach --name ncloud-nextcloud \
            --publish 127.0.0.1:8080:80 \
            --env NEXTCLOUD_ADMIN_USER=ncloud-ci \
            --env NEXTCLOUD_ADMIN_PASSWORD="$password" \
            --env SQLITE_DATABASE=ncloud \
            --env 'NEXTCLOUD_TRUSTED_DOMAINS=127.0.0.1 localhost' \
            nextcloud:32-apache
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/status.php | grep -q '"installed":true'; then
              docker exec --user www-data ncloud-nextcloud php occ app:enable photos
              docker exec --user www-data ncloud-nextcloud php occ app:install memories
              docker exec ncloud-nextcloud sh -c 'apt-get update -qq && apt-get install -y -qq libimage-exiftool-perl'
              docker exec --user www-data ncloud-nextcloud php occ config:app:set memories exiftool --value=/usr/bin/exiftool
              curl --fail-with-body --silent --show-error --user "ncloud-ci:$password" \
                -X MKCOL http://127.0.0.1:8080/remote.php/dav/files/ncloud-ci/ncloud-index
              printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGOQqMgGAAGnAPzLMdOkAAAAAElFTkSuQmCC' \
                | base64 --decode > "$RUNNER_TEMP/ncloud-seed.png"
              curl --fail-with-body --silent --show-error --user "ncloud-ci:$password" \
                -T "$RUNNER_TEMP/ncloud-seed.png" \
                http://127.0.0.1:8080/remote.php/dav/files/ncloud-ci/ncloud-index/seed.png
              docker exec --user www-data ncloud-nextcloud bash -c \
                'for i in $(seq 1 200); do cp data/ncloud-ci/files/ncloud-index/seed.png "data/ncloud-ci/files/ncloud-index/seed-$i.png"; done'
              docker exec --user www-data ncloud-nextcloud bash -c \
                'mkdir -p data/ncloud-ci/files/ncloud-index/Travel/Japan; cp data/ncloud-ci/files/ncloud-index/seed.png data/ncloud-ci/files/ncloud-index/Travel/Japan/nested.png'
              docker exec --user www-data ncloud-nextcloud php occ files:scan --path=/ncloud-ci/files/ncloud-index --no-interaction
              docker exec --user www-data ncloud-nextcloud php occ memories:index --user=ncloud-ci --no-interaction
              exit 0
            fi
            sleep 2
          done
          echo "Nextcloud did not become ready"
          exit 1
      - name: Verify real Nextcloud APIs
        if: success() || failure()
        run: |
          flutter test test/live_nextcloud_test.dart \
            --dart-define=LIVE_NEXTCLOUD=true \
            --dart-define=NEXTCLOUD_TEST_PASSWORD="$NEXTCLOUD_TEST_PASSWORD"
      - name: Set Android preview signing location
        run: echo "NCLOUD_PREVIEW_KEYSTORE=$RUNNER_TEMP/ncloud-android/debug.keystore" >> "$GITHUB_ENV"
      - name: Reuse development preview signer when available
        uses: actions/cache@v4
        with:
          path: ${{ env.NCLOUD_PREVIEW_KEYSTORE }}
          key: ncloud-android-preview-signer-v1
      - name: Initialize development preview signer
        run: |
          mkdir -p "$(dirname "$NCLOUD_PREVIEW_KEYSTORE")"
          if [ ! -f "$NCLOUD_PREVIEW_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$NCLOUD_PREVIEW_KEYSTORE" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build installable preview
        run: |
          start=$SECONDS
          flutter build apk --release --no-pub --build-number=${{ github.run_number }}
          elapsed=$((SECONDS - start))
          echo "Release APK build: ${elapsed}s"
          echo "### Android release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Build time: **${elapsed} seconds** (excluding tests and cache restore/save)." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify native Android folder sync routing
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :ncloud_folder_access:testDebugUnitTest --no-daemon --console=plain
      - name: Verify APK uses the cached preview signer
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          expected=$(keytool -list -v -keystore "$NCLOUD_PREVIEW_KEYSTORE" \
            -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          "$apksigner" verify --verbose --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | tee "$RUNNER_TEMP/ncloud-apk-signature.txt"
          actual=$(sed -n 's/^.*certificate SHA-256 digest: //p' \
            "$RUNNER_TEMP/ncloud-apk-signature.txt" | tr -d '[:space:]' | tr 'A-F' 'a-f')
          echo "Expected signer: $expected"
          echo "APK signer:      $actual"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "APK signing certificate does not match the cached preview key"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ncloud-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: pubspec.lock

  android-background-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse existing Android Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
          cache-overwrite-existing: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore Android SDK and NDK
        uses: ./.github/actions/android-toolchain
      - run: flutter pub get
      - name: Build background service device checks
        run: |
          flutter build apk --debug --no-pub --target-platform android-x64
          cd android
          ./gradlew :app:assembleDebugAndroidTest -Ptarget-platform=android-x64 --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-background-check
          path: |
            build/app/outputs/apk/debug/app-debug.apk
            build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  android-background:
    needs: android-background-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Locate Android SDK
        id: sdk
        run: echo "root=${ANDROID_HOME:?ANDROID_HOME is required}" >> "$GITHUB_OUTPUT"
      - name: Restore Android emulator system image
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.root }}/system-images/android-35/google_apis/x86_64
          key: android-system-image-v1-${{ runner.os }}-${{ runner.arch }}-35-google-apis-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: android-background-check
      - name: Allow Android emulator acceleration
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r debug/app-debug.apk
            adb install -r androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w app.ncloud.ncloud.test/androidx.test.runner.AndroidJUnitRunner | tee native-background-result.txt
            adb logcat -d > native-background-logcat.txt
            grep -q '^OK (' native-background-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-background-result
          path: |
            native-background-result.txt
            native-background-logcat.txt

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android, android-background]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ncloud-android
      - name: Publish private Android preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-release.apk ncloud-android.apk
          gh release create "v0.5.5-preview.${{ github.run_number }}" ncloud-android.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "ncloud Android preview #${{ github.run_number }}" \
            --notes "ncloud 0.5.5 preview: Drive lists unique direct children of the selected folder. Android selected-folder backup supports opt-in best-effort interval/daily/weekly schedules, notification controls, retryable settings loading, subfolder/type filters and up to three create-only upload lanes. No device or cloud originals are deleted or overwritten. Per-file receipts preserve confirmed progress; interrupted originals restart in full. Source folders and subfolders are preserved. Updates reuse the cached development signer. The accompanying iOS source includes scene lifecycle support and explicitly selected whole-Photos-album backup with best-effort background processing; this Android APK is not an iOS installer."

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Verify iOS scene startup
        timeout-minutes: 15
        run: |
          device=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$device" && test "$device" != null
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination "id=$device" \
            -parallel-testing-enabled NO -only-testing:RunnerTests \
            -resultBundlePath "$RUNNER_TEMP/ncloud-ios-native.xcresult" \
            CODE_SIGNING_ALLOWED=NO test -quiet
      - name: Verify iOS Drive navigation and real PhotoKit album exports
        timeout-minutes: 15
        run: |
          device=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl bootstatus "$device" -b
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGOQqMgGAAGnAPzLMdOkAAAAAElFTkSuQmCC' \
            | base64 --decode > "$RUNNER_TEMP/ncloud-probe.png"
          xcrun simctl addmedia "$device" "$RUNNER_TEMP/ncloud-probe.png"
          flutter build ios --simulator --debug --no-pub \
            --target integration_test/ios_album_drive_test.dart
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination "id=$device" \
            -parallel-testing-enabled NO -only-testing:RunnerUITests \
            -resultBundlePath "$RUNNER_TEMP/ncloud-ios-photos-ui.xcresult" \
            FLUTTER_TARGET="$GITHUB_WORKSPACE/integration_test/ios_album_drive_test.dart" \
            CODE_SIGNING_ALLOWED=NO test -quiet
          xcrun simctl bootstatus "$device" -b
          xcrun simctl launch "$device" app.ncloud.ncloud \
            --enable-checked-mode --verify-entry-points \
            --vm-service-port=8585 --disable-service-auth-codes
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8585/getVM > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8585/getVM > /dev/null
          VM_SERVICE_URL=http://127.0.0.1:8585 \
            dart run test_driver/ios_album_drive_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-test-results
          path: |
            ${{ runner.temp }}/ncloud-ios-native.xcresult
            ${{ runner.temp }}/ncloud-ios-photos-ui.xcresult
      - uses: actions/upload-artifact@v4
        with:
          name: ios-dependency-lock
          path: ios/Podfile.lock
      - uses: actions/upload-artifact@v4
        with:
          name: ncloud-ios-unsigned-not-installable
          path: build/ios/iphoneos/Runner.app
