name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_ios:
        description: Also build an unsigned iOS app (requires macOS runner)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart fix --apply --code=curly_braces_in_flow_control_structures --code=use_null_aware_elements
      - run: dart format lib test
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            lib/
            test/
      - run: flutter analyze
      - run: flutter test
      - run: flutter test test/ui_capture_test.dart --dart-define=CAPTURE_UI=true
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-previews
          path: build/ui/
      - name: Start isolated Nextcloud integration fixture
        if: success() || failure()
        run: |
          docker info >/dev/null
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "NEXTCLOUD_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --detach --name ncloud-nextcloud \
            --publish 127.0.0.1:8080:80 \
            --env NEXTCLOUD_ADMIN_USER=ncloud-ci \
            --env NEXTCLOUD_ADMIN_PASSWORD="$password" \
            --env SQLITE_DATABASE=ncloud \
            --env 'NEXTCLOUD_TRUSTED_DOMAINS=127.0.0.1 localhost' \
            nextcloud:32-apache
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/status.php | grep -q '"installed":true'; then
              exit 0
            fi
            sleep 2
          done
          echo "Nextcloud did not become ready"
          exit 1
      - name: Verify real Nextcloud APIs
        if: success() || failure()
        run: |
          flutter test test/live_nextcloud_test.dart \
            --dart-define=LIVE_NEXTCLOUD=true \
            --dart-define=NEXTCLOUD_TEST_PASSWORD="$NEXTCLOUD_TEST_PASSWORD"
      - name: Reuse development preview signer when available
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ncloud-android-preview-signer-v1
      - name: Build installable preview
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: ncloud-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: pubspec.lock

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ncloud-android
      - name: Publish private Android preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-release.apk ncloud-android.apk
          gh release create "v0.2.0-preview.${{ github.run_number }}" ncloud-android.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "ncloud Android preview #${{ github.run_number }}" \
            --notes "Library redesign: photo timeline, folder albums, separate Drive, multi-select organization, swipe/zoom viewer, slideshow, in-app video, read-only sharing links and trash restore. Download ncloud-android.apk on Android and choose Try demo or connect Nextcloud. Development signing only; see README for implemented features and remaining non-AI roadmap."

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-dependency-lock
          path: ios/Podfile.lock
      - uses: actions/upload-artifact@v4
        with:
          name: ncloud-ios-unsigned-not-installable
          path: build/ios/iphoneos/Runner.app
