name: ncloud
description: A private, unified Nextcloud photos and files app.
publish_to: none
version: 0.5.5+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  xml: ^6.6.1
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.3.7
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  video_player: ^2.10.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  sqflite: ^2.4.2
  workmanager: 0.10.10
  ncloud_folder_access:
    path: packages/ncloud_folder_access

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
