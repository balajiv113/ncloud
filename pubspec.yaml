name: ncloud
description: A private, unified Nextcloud photos and files app.
publish_to: none
version: 0.5.5+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.6
  xml: ^7.1.0
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.4.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  video_player: ^2.10.1
  flutter_map: ^8.2.2
  latlong2: ^0.10.1
  sqflite: ^2.4.2
  workmanager: 0.10.10
  ncloud_folder_access:
    path: packages/ncloud_folder_access

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true

dependency_overrides:
  # Local copy of share_plus 13.3.1 with its Android build moved to AGP built-in Kotlin.
  share_plus:
    path: packages/share_plus
